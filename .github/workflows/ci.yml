name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - run: npm ci

      # PageProps/LayoutProps are generated, not checked in, so they have to
      # exist before tsc runs on a clean checkout.
      - name: Generate route types
        run: npx next typegen

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
